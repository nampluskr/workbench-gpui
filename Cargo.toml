[package]
name = "workbench-gpui"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
dirs = "=7.0.0"
ignore = "=0.4.34"
regex = "=1.13.1"
gpui-kit = "=0.8.1"
jsonc-parser = { version = "=0.34.0", features = ["serde"] }
notify = "8.2"
rfd = "=0.17.2"
serde_json = "=1.0.154"
trash = "=5.2.9"
tree-sitter = { git = "https://github.com/tree-sitter/tree-sitter", rev = "803c6ebaac27d69e1808b45058482e868d073ceb" }
tree-sitter-language = "=0.1.8"
tree-sitter-bash = "=0.25.1"
tree-sitter-diff = "=0.1.0"
tree-sitter-gitcommit = { git = "https://github.com/zed-industries/tree-sitter-git-commit", rev = "88309716a69dd13ab83443721ba6e0b491d37ee9" }
tree-sitter-go = { git = "https://github.com/zed-industries/tree-sitter-go", rev = "6862a49e3c5a7567a6c576420e9a8f944e198a85" }
tree-sitter-go-mod = { package = "tree-sitter-gomod", git = "https://github.com/camdencheek/tree-sitter-go-mod", rev = "2e886870578eeba1927a2dc4bd2e2b3f598c5f9a" }
tree-sitter-gowork = { git = "https://github.com/zed-industries/tree-sitter-go-work", rev = "acb0617bf7f4fda02c6217676cc64acb89536dc7" }
tree-sitter-python = "=0.25.0"
tree-sitter-typescript = { git = "https://github.com/zed-industries/tree-sitter-typescript", rev = "e2c53597d6a5d9cf7bbe8dccde576fe1e46c5899" }
tree-sitter-yaml = { git = "https://github.com/zed-industries/tree-sitter-yaml", rev = "baff0b51c64ef6a1fb1f8390f3ad6015b83ec13a" }
tree-sitter-jsdoc = "=0.23.2"
tree-sitter-regex = "=0.24.3"
tree-sitter-c = "=0.24.1"
tree-sitter-cpp = { git = "https://github.com/tree-sitter/tree-sitter-cpp", rev = "5cb9b693cfd7bfacab1d9ff4acac1a4150700609" }
tree-sitter-css = "=0.23.2"
tree-sitter-rust = "=0.24.2"
tree-sitter-json = "=0.24.8"
tree-sitter-md = { git = "https://github.com/zed-industries/tree-sitter-markdown", rev = "b596e737286780d7bfa9fcddceaeeb754574b352" }
tree-sitter-git-rebase = { git = "https://github.com/the-mikedavis/tree-sitter-git-rebase", rev = "39bf3b7566c86ccffd70aaa5105c7c8b76788975" }
tree-sitter-gitattributes = { git = "https://github.com/tree-sitter-grammars/tree-sitter-gitattributes", rev = "1b7af09d45b579f9f288453b95ad555f1f431645" }

[build-dependencies]
cc = "=1.10.0"

[dev-dependencies]
toml = "=1.1.8"

[patch.crates-io]
gpui-base = { path = "vendor/gpui-base" }
tree-sitter-language = { git = "https://github.com/tree-sitter/tree-sitter", rev = "803c6ebaac27d69e1808b45058482e868d073ceb" }
